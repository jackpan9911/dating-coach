        // 统计卡片只在有内容（统计面板 / 历史匹配）时出现
        function syncStatsCardVisibility() {
            const card = document.getElementById('statsCard');
            if (!card) return;
            const statsOn = document.getElementById('statsPanel').classList.contains('show');
            const matchOn = document.getElementById('historyMatch').classList.contains('show');
            card.classList.toggle('show', statsOn || matchOn);
        }

        function checkHistoryMatch() {
            const matchDiv = document.getElementById('historyMatch');
            const matchList = document.getElementById('matchList');
            if (jackpotList.length === 0 || !currentDrawNumbers) {
                matchDiv.classList.remove('show');
                syncStatsCardVisibility();
                return;
            }
            const matches = jackpotList.filter(j => 
                arraysEqual(currentDrawNumbers.front, j.front) && 
                arraysEqual(currentDrawNumbers.back, j.back)
            );
            if (matches.length === 0) {
                matchList.innerHTML = '<div class="no-match">本期开奖号码未匹配历史一等奖记录</div>';
            } else {
                matchList.innerHTML = matches.map(m => 
                    '<div class="match-item">' +
                        '<div class="match-period">🏆 匹配历史第' + m.period + '期一等奖！</div>' +
                        '<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">' +
                            '<div><span style="color:rgba(255,255,255,0.5)">前区:</span> ' + currentDrawNumbers.front.map(n => '<span class="ball front matched">' + n + '</span>').join('') + '</div>' +
                            '<div><span style="color:rgba(255,255,255,0.5)">后区:</span> ' + currentDrawNumbers.back.map(n => '<span class="ball back matched">' + n + '</span>').join('') + '</div>' +
                        '</div>' +
                    '</div>'
                ).join('');
            }
            matchDiv.classList.add('show');
            syncStatsCardVisibility();
        }

        function arraysEqual(a, b) {
            if (a.length !== b.length) return false;
            return a.every((val, i) => val === b[i]);
        }

        function setSimCount(count) {
            document.getElementById('simCount').value = count;
        }

        function randomDraw() {
            try {
                setDrawInputs(randomFront(), randomBack());
                flashDrawInputs();
            } catch (err) {
                console.error('随机开奖失败:', err);
                alert('随机开奖失败，请重试');
            }
        }

        // ================================================================
        // 快速选号：随机生成 1 组 / 5 组候选号码，点一组填入开奖输入框
        // ================================================================
        let pickCandidates = [];

        // 把一组号码写进 7 个输入框（前区 5 + 后区 2）
        function setDrawInputs(front, back) {
            for (let i = 0; i < 5; i++) {
                const el = document.getElementById('front' + i);
                if (el) el.value = front[i];
            }
            for (let i = 0; i < 2; i++) {
                const el = document.getElementById('back' + i);
                if (el) el.value = back[i];
            }
            // 号码变了，之前那次开奖号码作废
            currentDrawNumbers = null;
        }

        // 生成候选号码；groupCount=1 时直接填入，>1 时列出供选择
        function generatePicks(groupCount) {
            const count = Math.min(20, Math.max(1, parseInt(groupCount, 10) || 1));
            const sets = [];
            const seen = new Set();
            let guard = 0;
            // 同一批候选内部去重，避免 5 组里出现重复号码
            while (sets.length < count && guard < count * 80) {
                guard++;
                const front = randomFront();
                const back = randomBack();
                const key = front.join(',') + '|' + back.join(',');
                if (seen.has(key)) continue;
                seen.add(key);
                sets.push({ front, back });
            }
            pickCandidates = sets;
            if (count === 1) {
                applyPick(0);
            } else {
                renderPickList(-1);
            }
        }

        function renderPickList(activeIndex) {
            const list = document.getElementById('quickPickList');
            if (!list) return;
            list.innerHTML = pickCandidates.map((pick, index) => {
                const balls = pick.front.map(n => '<span class="pick-ball front">' + n + '</span>').join('') +
                    pick.back.map(n => '<span class="pick-ball back">' + n + '</span>').join('');
                return '<button type="button" class="pick-item' + (index === activeIndex ? ' active' : '') +
                    '" onclick="applyPick(' + index + ')">' +
                    '<span class="pick-index">第' + (index + 1) + '组</span>' +
                    '<span class="pick-balls">' + balls + '</span>' +
                    '<span class="pick-fill">' + (index === activeIndex ? '已填入' : '点此填入') + '</span>' +
                    '</button>';
            }).join('');
        }

        function applyPick(index) {
            const pick = pickCandidates[index];
            if (!pick) return;
            setDrawInputs(pick.front, pick.back);
            renderPickList(index);
            flashDrawInputs();
        }

        // 填入后让号码球闪一下，明确"已经填进去了"
        function flashDrawInputs() {
            const inputs = document.querySelectorAll('.draw-input');
            inputs.forEach(input => {
                input.classList.remove('flash');
                void input.offsetWidth;   // 强制重排，允许动画重复播放
                input.classList.add('flash');
            });
            setTimeout(() => inputs.forEach(input => input.classList.remove('flash')), 700);
        }

        function clearDrawInputs() {
            for (let i = 0; i < 5; i++) document.getElementById('front' + i).value = '';
            for (let i = 0; i < 2; i++) document.getElementById('back' + i).value = '';
            currentDrawNumbers = null;
            pickCandidates = [];
            renderPickList(-1);
        }

        function clearAll() {
            if (history.length > 0 && !confirm('确定清空所有模拟记录？')) return;
            history = [];
            filteredHistory = [];
            currentPage = 1;
            currentDrawNumbers = null;
            // 清空历史开奖记录
            drawHistory = [];
            totalStats = {};
            undrawnCount = 0;
            clearDrawInputs();
            document.getElementById('statsPanel').classList.remove('show');
            document.getElementById('historyMatch').classList.remove('show');
            syncStatsCardVisibility();
            document.getElementById('simInfo').textContent = '';
            document.getElementById('filterLevel').value = 'all';
            document.getElementById('filterId').value = '';
            updateHistoryDisplay();
            updateFilterInfo();
        }

        // 百万级数据下逐字过滤会卡顿，输入框改为防抖后再筛选
        let filterTimer = null;
        function scheduleApplyFilter() {
            if (filterTimer) clearTimeout(filterTimer);
            filterTimer = setTimeout(applyFilter, 300);
        }

        function applyFilter() {
            const levelFilter = document.getElementById('filterLevel').value;
            const idFilter = document.getElementById('filterId').value;

            // 无筛选条件时直接引用全量数组，省掉一次百万级遍历
            if (levelFilter === 'all' && !idFilter) {
                filteredHistory = history;
                currentPage = 1;
                updateHistoryDisplay();
                updateFilterInfo();
                return;
            }

            filteredHistory = history.filter(record => {
                if (levelFilter === 'win' && (record.level === null || record.level === 0)) return false;
                if (levelFilter === 'lose' && (record.level !== null && record.level > 0)) return false;
                if (levelFilter === '4-7' && (record.level === null || record.level < 4 || record.level > 7)) return false;
                if (levelFilter !== 'all' && levelFilter !== 'win' && levelFilter !== 'lose' && levelFilter !== '4-7') {
                    if (record.level !== parseInt(levelFilter)) return false;
                }
                if (idFilter && record.id !== parseInt(idFilter)) return false;
                return true;
            });
            currentPage = 1;
            updateHistoryDisplay();
            updateFilterInfo();
        }
        
        let winFilterActive = false;
        function toggleWinFilter() {
            const btn = document.getElementById('winFilterBtn');
            const select = document.getElementById('filterLevel');
            
            if (winFilterActive) {
                // 取消仅中奖筛选
                winFilterActive = false;
                btn.style.background = 'linear-gradient(135deg, #ffd700, #ff8c00)';
                btn.style.color = '#000';
                select.value = 'all';
            } else {
                // 启用仅中奖筛选
                winFilterActive = true;
                btn.style.background = 'linear-gradient(135deg, #1abc9c, #16a085)';
                btn.style.color = '#fff';
                select.value = 'win';
            }
            applyFilter();
        }

        function updateFilterInfo() {
            const filterInfo = document.getElementById('filterInfo');
            if (history.length === 0) {
                filterInfo.textContent = '共 0 注';
            } else if (filteredHistory.length === history.length) {
                filterInfo.textContent = '共 ' + history.length.toLocaleString() + ' 注';
            } else {
                filterInfo.textContent = '筛选: ' + filteredHistory.length.toLocaleString() + ' / ' + history.length.toLocaleString() + ' 注';
            }
        }

        function updatePagination() {
            const pagination = document.getElementById('pagination');
            const pageInfo = document.getElementById('pageInfo');
            const prevBtn = document.getElementById('prevPage');
            const nextBtn = document.getElementById('nextPage');
            const totalPages = Math.ceil(filteredHistory.length / pageSize);
            
            if (filteredHistory.length === 0) {
                pagination.classList.remove('show');
                return;
            }
            
            if (totalPages <= 1) {
                pagination.classList.remove('show');
                return;
            }
            
            pagination.classList.add('show');
            pageInfo.innerHTML = '第 <strong>' + currentPage + '</strong> / ' + totalPages + ' 页';
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
        }

        function goToPage(page) {
            const totalPages = Math.ceil(filteredHistory.length / pageSize);
            if (page < 1) page = 1;
            if (page > totalPages) page = totalPages;
            currentPage = page;
            updateHistoryDisplay();
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                updateHistoryDisplay();
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredHistory.length / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                updateHistoryDisplay();
            }
        }

        function updateHistoryDisplay() {
            const container = document.getElementById('historyContainer');
            const empty = document.getElementById('emptyHistory');
            const tbody = document.getElementById('historyBody');
            if (history.length === 0) {
                container.classList.remove('show');
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';
            container.classList.add('show');
            
            const totalPages = Math.ceil(filteredHistory.length / pageSize);
            if (currentPage > totalPages) currentPage = totalPages || 1;
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = filteredHistory.slice(start, end);
            
            tbody.innerHTML = pageData.map(record => {
                let levelBadge, prizeCell, rowClass = '', idClass = '', prizeClass = '', prizeAmountClass = '';

                    levelBadge = '<span class="pending-status">待开奖</span>';
                    prizeCell = '-';
                } else if (record.level > 0) {
                    levelBadge = '<span class="prize-badge p' + record.level + (record.level <= 2 ? ' badge-pulse' : '') + '">' + PRIZE_CONFIG[record.level].name + '</span>';
                    prizeCell = formatNumShort(record.prize);
                    prizeAmountClass = 'prize-amount' + (record.level <= 2 ? ' high' : '');
                    if (record.level === 1) {
                        rowClass = 'row-p1';
                        idClass = 'id-highlight';
                        prizeClass = 'prize-cell win';
                    } else if (record.level === 2) {
                        rowClass = 'row-p2';
                        idClass = 'id-silver';
                        prizeClass = 'prize-cell silver';
                    } else if (record.level === 3) {
                        rowClass = 'row-p3';
                        idClass = 'id-bronze';
                        prizeClass = 'prize-cell bronze';
                    } else if (record.level === 4) {
                        rowClass = 'row-p4';
                    } else if (record.level === 5 || record.level === 6) {
                        rowClass = 'row-p' + record.level;
                    }
                } else {
                    levelBadge = '<span class="prize-badge none">未中奖</span>';
                    prizeCell = '-';
                }
                const drawFrontHtml = record.drawFront ? record.drawFront.map(n => 
                    '<span class="mini-ball front' + (record.userFront.includes(n) ? ' matched' : '') + '">' + n + '</span>'
                ).join('') : '-';
                const drawBackHtml = record.drawBack ? record.drawBack.map(n => 
                    '<span class="mini-ball back' + (record.userBack.includes(n) ? ' matched' : '') + '">' + n + '</span>'
                ).join('') : '-';
                const matches = (record.frontMatches !== null ? record.frontMatches : '-') + '+' + (record.backMatches !== null ? record.backMatches : '-');
                // 奖级明细
                let prizeDetailCell = '-';
                if (record.level !== null && record.level > 0) {
                    const prizeAmt = record.prize;
                    const prizeName = PRIZE_CONFIG[record.level].name;
                    prizeDetailCell = '<span style="font-size:0.75rem;color:rgba(255,255,255,0.7);">1注 × ' + formatNumShort(prizeAmt) + '元</span>';
                } else if (record.level === null) {
                    prizeDetailCell = '<span style="color:rgba(255,215,0,0.6);">待开奖</span>';
                }
                return '<tr class="' + rowClass + '">' +
                    '<td class="' + idClass + '">#' + record.id + '</td>' +
                    '<td>' + record.userFront.map(n => '<span class="mini-ball front">' + n + '</span>').join('') + '</td>' +
                    '<td>' + record.userBack.map(n => '<span class="mini-ball back">' + n + '</span>').join('') + '</td>' +
                    '<td>' + drawFrontHtml + '</td>' +
                    '<td>' + drawBackHtml + '</td>' +
                    '<td><strong>' + matches + '</strong></td>' +
                    '<td>' + levelBadge + '</td>' +
                    '<td class="' + prizeClass + '"><span class="' + prizeAmountClass + '">' + prizeCell + '</span></td>' +
                    '<td style="text-align:left;padding-left:8px;">' + prizeDetailCell + '</td>' +
                '</tr>';
            }).join('');
            
            updatePagination();
        }

        function exportHistoryCSV() {
            if (history.length === 0) { alert('无记录可导出'); return; }
            exportToCSV(history, '投注记录_全部_' + Date.now() + '.csv');
        }

        function exportFilteredCSV() {
            if (filteredHistory.length === 0) { alert('无筛选结果可导出'); return; }
            exportToCSV(filteredHistory, '投注记录_筛选_' + Date.now() + '.csv');
        }

        function exportToCSV(data, filename) {
            const headers = ['序号', '前区投注', '后区投注', '前区开奖', '后区开奖', '前区命中', '后区命中', '奖级', '奖金', '奖级明细'];
            const rows = data.map(r => [
                r.id,
                r.userFront.join(' '),
                r.userBack.join(' '),
                r.drawFront ? r.drawFront.join(' ') : '',
                r.drawBack ? r.drawBack.join(' ') : '',
                r.frontMatches !== null ? r.frontMatches : '',
                r.backMatches !== null ? r.backMatches : '',
                r.level !== null ? (r.level > 0 ? PRIZE_CONFIG[r.level].name : '未中奖') : '待开奖',
                r.prize,
                r.level !== null && r.level > 0 ? '1注 × ' + r.prize + '元' : (r.level === null ? '待开奖' : '-')
            ]);
            const csv = [headers, ...rows].map(row => row.map(cell => '"' + cell + '"').join(',')).join('\n');
            downloadCSV('\uFEFF' + csv, filename);
        }

        function downloadCSV(content, filename) {
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
